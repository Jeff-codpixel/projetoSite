<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>By Belly Store</title>
    <img src="img/logo belly.jpg" alt="Logo By Belly Store" class="foto">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <a href="https://wa.me/SEUNUMERO" target="_blank">WhatsApp</a>
            <a href="https://instagram.com/SEUINSTAGRAM" target="_blank">Instagram</a>
        </nav>
        <div class="barra de pesquisa">
            <input type="texto" id="pesquisa" placeholder="Pesquisar produtos...">
        </div>
    </header>

    <section class="banner">
    <div class="banner-texto">
        <h1></h1>
        <h2></h2>
    </div>
    </section>

    <section class="filtros">
        <h2>Filtrar peças</h2>

        <select id="filtro-tamanho">
            <option value="">Tamanho</option>
            <option value="P">P</option>
            <option value="M">M</option>
            <option value="G">G</option>
        </select>

        <select id="filtro-tipo">
            <option value="">Tipo</option>
            <option value="top">Top</option>
            <option value="legging">Legging</option>
            <option value="short">Short</option>
            <option value="Blusa">Blusa</option>
            <option value="Macaquinho">Macaquinho</option>
        </select>
    </section>

    <section id="produtos"></section>

    <script src="script.js"></script>
</body>
</html>
